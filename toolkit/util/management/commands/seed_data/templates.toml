roles = ["Keyholder", "Sound Technician level 1", "Sound Technician level 2", "Bar Staff - Shift 1", "Bar Staff - Shift 2", "Box Office - Admission Tickets", "Usher - Fire Trained"]
tags = ["music", "performance"]

[[templates]]
name = "Volunteer Induction"
