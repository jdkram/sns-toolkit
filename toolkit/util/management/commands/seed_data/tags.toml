# Background colours used when generating placeholder event images,
# keyed by primary tag. Chosen to be visually distinct and cinema-appropriate.
# rgb values are [R, G, B] integers 0-255.

[[tag_colours]]
tag = "film"
rgb = [20, 20, 60]       # dark navy

[[tag_colours]]
tag = "music"
rgb = [60, 10, 60]       # deep purple

[[tag_colours]]
