[[thursday_films]]
name = "Funeral Parade of Roses"
copy_summary = "Toshio Matsumoto's wildly subversive 1969 portrait of Tokyo's gay underground. Breaks every rule of narrative and form, interpolates interviews, and ends somewhere you will absolutely not expect."
copy = "In 1960s Tokyo, Gonda owns a bar where gay, cross-dresser, and trans scenes meet. As the younger Eddie starts an affair with Gonda, she ignites the jealousy of the madam, unaware of another kind of history between them."
film_information = "Dir. Toshio Matsumoto, JP 1969"
