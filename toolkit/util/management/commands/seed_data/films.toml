[[thursday_films]]
name = "Fantastic Planet"
copy_summary = "Rene Laloux's psychedelic animated allegory: on a distant planet, tiny humans are kept as pets by giant blue beings. A hallucinatory fable about colonialism, animal rights, and the logic of oppression."
copy = "On a planet Ygam, technologically advanced blue humanoids called Draags treat tiny human beings as ignorant animals, kept as pets or hunted as vermin. A young human who has absorbed Draag knowledge uses it to organise resistance."
film_information = "Dir. Rene Laloux, FR / CS 1973"
pricing = "£7/£5/£3/£0"
tags = ["film"]
