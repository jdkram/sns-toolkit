film_information = "Dir. Sarah Maldoror, AO / FR 1972"
pricing = "£7/£5/£3/£0"
tags = ["film"]
image_url = "https://image.tmdb.org/t/p/w780/isnDnTWjOE9EJqsKXvCwZQrIkeE.jpg"

[[sunday_films]]
name = "The Arbor"
copy_summary = "Clio Barnard's formally radical portrait of Andrea Dunbar, Bradford playwright who died aged 29, and her daughter Lorraine. Actors lip-sync to real interviews. Extraordinary and heartbreaking."
