film_information = "Dir. Clio Barnard, GB 2010"
pricing = "£7/£5/£3/£0"
tags = ["film"]
image_url = "https://image.tmdb.org/t/p/w780/1ILtGNSUTyrZi8LAco4zkMWXM3q.jpg"

[[sunday_films]]
