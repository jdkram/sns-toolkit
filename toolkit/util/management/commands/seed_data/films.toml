copy = "In 1992, teenager Sandi Tan shot Singapore's first indie road movie with her enigmatic American mentor Georges, who then vanished with all the footage. Twenty years later, film is recovered."
film_information = "Dir. Sandi Tan, SG / US 2018"
pricing = "£7/£5/£3/£0"
tags = ["film"]
image_url = "https://image.tmdb.org/t/p/w780/spd1fZNePSQFRhNam66jx3ZMoxF.jpg"

