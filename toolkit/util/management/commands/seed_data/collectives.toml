[[collectives]]
slug = "keyholder"
name = "Keyholders"
colour = "#34495e"
display_order = 10
volunteer_count = "12–18 active keyholders"
about = "Keyholders can open and close the building independently. This is a responsibility role: keyholders are the people who make everything else possible."
roles = "Opening and closing the building for events, covering unplanned access needs, being contactable when you're listed on the keyholder rota."
organising = "Keyholder rota in the toolkit. Signal group for emergencies."
proud_of = "The building being available when it needs to be."
get_involved = "Keyholders are nominated by existing volunteers after you've been around a while. Keep showing up, get comfortable with the building, and someone will raise it with you."
invite_only = true
listed_publicly = true
public_copy = "Keyholders open and close the building for events and cover unplanned access needs. It's a responsibility role you're nominated for after you've been around a while and know the building well."

