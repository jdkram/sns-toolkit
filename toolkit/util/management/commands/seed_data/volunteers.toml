# ── Pool health test scenarios ────────────────────────────────────────────────
# One volunteer per distinct case on the volunteer pool maintenance page.
# Includes both edge cases and a larger realistic cohort so the dashboard
# shows something meaningful with pagination/scroll.
# Fields understood by seed_dev_data (not standard volunteer fields):
#   status                      — volunteer lifecycle status (default: "active")
#   last_login_days_ago         — set user.last_login to this many days ago;
#                                  omit entirely for a never-logged-in account
#   date_joined_days_ago        — set user.date_joined to this many days ago
#   membership_expires_days_from_now — set member.membership_expires relative to
#                                  today; negative = already expired

[[volunteers]]
name = "Ioana Feraru"
email = "ioana.feraru@example.com"
# Dormant — logged in 500 days ago (past the 365-day dormancy threshold).
# Appears in the Dormant cohort with a visible last-login date.
status = "dormant"
last_login_days_ago = 500
membership_expires_days_from_now = -200

[[volunteers]]
name = "Yusuf Bekele"
email = "yusuf.bekele@example.com"
# Dormant, never logged in — account created 200 days ago (past the 90-day
# never-logged-in grace period). Shows the re-induction badge.
