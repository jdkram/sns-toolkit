# Building map notes seed data for the Star and Shadow.
# room_id must match an entry in _FLOORPLAN_ROOMS in labs/views.py.

[[notes]]
room_id = "room-cinema"
body = "Capacity: 90 seated. Projector: Sony SRX-R515P 4K. 16mm projector available — contact Cinema collective to arrange. Emergency exits: side door (unlocks with green lever) and fire door at screen end."

[[notes]]
room_id = "room-venue"
body = "Flexible space — 120 standing, 80 with chairs. PA system in the tech store cupboard. Load-in via back entrance. Key is on the main keyring."

[[notes]]
room_id = "room-bar"
body = "Bar stock and cash handled by Bar collective. Float in the cash box in the bar office cupboard. Contactless terminal needs charging if unused for a week."

[[notes]]
room_id = "room-cafe"
body = "Café rota on the noticeboard. Coffee machine: clean the group head after every session — instructions laminated above the machine. Closing time checklist in the kitchen drawer."

[[notes]]
room_id = "room-workshop"
body = "Power tools: check the inspection tags are in date before use. Ventilation: open both windows when sanding or spraying. First aid kit on the shelf above the fire extinguisher."

[[notes]]
room_id = "room-screen-printing-room"
body = "Inks stored by colour in the cabinet on the left. Squeegees hang on the far wall — clean immediately after use or they're ruined. Emulsion (in the fridge) expires 3 months after opening."

[[notes]]
room_id = "room-dark-room"
body = "No food or drinks. Red safe-light only when paper is out. Developer and fixer in labelled bottles — dispose of exhausted chemicals via the hazardous waste collection, not the sink."

[[notes]]
room_id = "room-projection-booth"
body = "DCP server: Christie IMB. Playlist import via USB or network share. Dovetail login pinned inside the cupboard door. Do not adjust the lamp hours without logging it in the projection log."

[[notes]]
room_id = "room-kitchen"
body = "Food hygiene: anyone cooking for events must have level 2 certificate — contact the Kitchen collective. Temperature log on the clipboard. Commercial dishwasher: use the eco cycle unless heavily soiled."

[[notes]]
room_id = "room-green-room"
body = "Performer green room. Lockable with the green room key (separate from main keyring — ask front of house). Mini fridge stocked by Front of House. Wi-Fi password on the noticeboard."

[[notes]]
room_id = "room-meeting-room"
body = "Bookable via the meeting room calendar on Nextcloud. Whiteboard markers in the tray — please check they work before your meeting. HDMI cable in the top drawer. Laptop stand folds and stores under the table."

[[notes]]
room_id = "room-it-cupboard"
body = "Patch panel top-left. Router and managed switch on the second shelf. Passwords and network diagram in the IT folder on Nextcloud (ask a sysadmin for access). Spare cables in the box on the floor — badly organised, sorry."

[[notes]]
room_id = "room-store-cupboard"
body = "Cleaning supplies on the left shelves. Paint (white gloss, white emulsion) on the floor at the back. The laminator is here too — heat up for 5 minutes before use. Lost property box: items kept 3 months then donated."

[[notes]]
room_id = "room-cleaning-cupboard"
body = "Mop buckets: fill to the line, not higher — they're heavy. Colour-coded cloths: red=toilets, blue=kitchen, green=bar/café, yellow=general. Stock list on the inside of the door — update it when you take the last of something."

[[notes]]
room_id = "room-accessible-toilet"
body = "RADAR key on the main keyring. Baby changing table folds out from the left wall. Emergency pull cord — do not tie up."
