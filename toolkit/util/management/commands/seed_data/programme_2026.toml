# Real Star and Shadow programme (Jan-Dec 2026) for the demo site.
#
# Titles come from the public programme and archive at
# starandshadow.org.uk; synopsis, director, runtime, poster, BBFC
# certificate and trailer were pulled from TMDB. Pools are consumed by
# seed_dev_data ahead of the older pools in films.toml, so the recent and
# upcoming weeks look like the live listing. Extra tags (horror, lgbtq,
# silent-film, live-score, tv-on-the-big-screen, documentary, family,
# twenty-for-twenty, noirvember) are defined in tags.toml.

