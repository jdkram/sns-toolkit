{% extends "base_admin.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ action }} maintenance task{% endblock %}

{% block body %}
<h2>{{ action }} maintenance task</h2>

<form method="post">
  {% csrf_token %}
  {% crispy form %}
  <div style="margin-top: 1rem;">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url "operations-schedule" %}" class="btn btn-secondary" style="margin-left: 0.5rem;">Cancel</a>
  </div>
</form>
{% endblock %}
