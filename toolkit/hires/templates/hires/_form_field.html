<div class="hire-field{% if f.errors %} hire-field--error{% endif %}" id="field-{{ f.html_name }}">
  <label class="hire-label" for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="hire-req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span>{% endif %}</label>
  {% if f.help_text %}<div class="hire-help" id="help-{{ f.html_name }}">{{ f.help_text }}</div>{% endif %}
  {{ f }}
  {% for err in f.errors %}<div class="hire-err" role="alert">&#9888; {{ err }}</div>{% endfor %}
</div>
