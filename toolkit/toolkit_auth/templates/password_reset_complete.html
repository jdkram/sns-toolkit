{% extends "base_public.html" %}

{% block css %}
{{ block.super }}
<link rel="stylesheet" type="text/css" href="{{ STATIC_URL }}css/login.css">
{% endblock %}
{% block script-page-setup %}{% endblock %}

{% block title %}Password updated{% endblock %}

{% block body %}
<div class="login-card" style="max-width: 400px; margin: 40px auto; padding: 32px 24px; background: #fff; border-radius: 8px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); text-align: center;">
  <h2 style="margin-bottom: 24px;">Password updated</h2>
  <p>
    Your password has been updated. Give it a whirl and <a href="{% url 'login' %}">log in</a> now.
  </p>
</div>
{% endblock %}
