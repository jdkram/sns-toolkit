{% extends "base_wagtail.html" %}
{% load wagtailcore_tags wagtailimages_tags %}

{% block body %}
{{ block.super }}
<div class="programme">
    <div class="grid-sizer"></div>
    <div class="gutter-sizer"></div>


    {% if page.image %}
    <div class="grid-item grid-item--width5 event-image">
        <div class="event_image form-banner">
            {% image page.image original %}
        </div>
    </div>
    {% endif %}

    <div class="grid-item grid-item--width4">
        <h3>{{ page.title }}</h3>
        <br>
        <div class="copy copy--readable">
            {{ page.thank_you_text|richtext }}
        </div>
    </div>

</div>
{% endblock %}
