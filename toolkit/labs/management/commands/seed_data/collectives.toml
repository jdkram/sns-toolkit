contact = ""

[[collectives]]
name = "Finance Collective"
slug = "finance"
display_order = 90
volunteer_count = ""
about = "The Finance Collective keeps the financial records up to date to comply with the law, HMRC, and the S&S Governing Document. It provides good-quality, timely financial information to S&S volunteers on a quarterly basis to inform decisions about the organisation."
roles = "All tasks and responsibilities are documented in 'The Finance Bible' on the Nextcloud, including a contingency plan and the S&S spending authorisation policy."
organising = "Three meetings per year by Zoom. Quarterly reports and a 12-month cash forecast are emailed to all working group email lists. The collective presents the Annual Accounts at the AGM and gives a brief financial overview at the Participatory Budgeting meeting."
proud_of = ""
get_involved = "Volunteers need to be available, reliable, methodical, honest, and skilled in Excel and Sage. Open information-sharing sessions are planned. Get in touch via the finance collective contact."
contact = ""

[[collectives]]
name = "Keyholder Collective"
slug = "keyholder"
display_order = 100
volunteer_count = ""
about = "The Keyholder group is made up of volunteers trained to perform the keyholder role. There must be at least one keyholder on shift for every event. Keyholders open up the building for volunteers and the public, and have many responsibilities from cashing up to taking care of everyone's safety and comfort."
roles = "Keyholders are first in, last out. They are responsible for the security of the building, timely access for staff, the safety and comfort of volunteers and the public, supervision of the safe and tills, management of emergency situations, and the set of keys registered to them."
organising = "Communication via a keyholder WhatsApp group and email list. Two key documents are on the Nextcloud: the Keyholder Approval and Recruitment Policy, and the Keyholder Bible."
proud_of = ""
get_involved = "Keyholders must be regular volunteers who have volunteered for at least one year, and must be punctual, reliable, and communicative. Prospective keyholders can nominate themselves at a Caretaking Meeting."
contact = ""

