display_order = 80
volunteer_count = ""
about = "The Film Projection/Tech Collective projects films and helps with tech in the cinema."
roles = "Roles include: Projectionist — DVD, MP4, DCP, 16mm, and 35mm formats; projectionist shadowing; audio-visual technician (setting up audio and/or Zoom projection for filmmaker Q&As); contact with Omnex (the technicians who service the projectors); projectionist training; communicating with programming; and coordinating clean-ups."
organising = "Meetings quarterly, in person, for meetings and cleaning up the space."
proud_of = ""
