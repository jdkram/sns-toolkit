invite_only = true
volunteer_count = ""
about = "The Safer Spaces Collective supports the Star and Shadow in being a welcoming, inclusive, and accountable community. It maintains and embeds the Safer Spaces & Anti-Oppression Policy, which outlines the shared commitment to treating one another with care, respect, and fairness."
roles = "Creating resources to help volunteers navigate the non-hierarchical set-up. Running workshops such as Listening Skills training. A smaller group within Safer Spaces acts as mediators and helps people talk when communication has broken down."
organising = "At least once a quarter, more if needed."
proud_of = ""
get_involved = "Volunteers in Safer Spaces must have been volunteering for at least a year to ensure they understand the cinema and its values. Anyone interested can get in touch by email."
contact = ""

[[collectives.defined_roles]]
title = "Safer Spaces Volunteer"
description = "Help create resources for navigating the S&S non-hierarchical structure, contribute to workshops like Listening Skills training, and support the embedding of the Safer Spaces & Anti-Oppression Policy. Requires at least one year of prior volunteering."
time_commitment = "Collective meetings at least quarterly; additional time for workshops and resource creation as needed"
getting_started = "Get in touch by email once you have been volunteering at S&S for at least a year."
needs_volunteers = false
open_to_new_volunteers = true

[[collectives.defined_roles]]
title = "Mediator"
description = "Part of a smaller group within Safer Spaces that helps people talk when communication has broken down. Involves facilitated conversations and a high degree of trust, discretion, and care."
time_commitment = "As needed; not a regular scheduled commitment"
getting_started = "This role is filled by invitation within the Safer Spaces Collective."
needs_volunteers = false
open_to_new_volunteers = false

