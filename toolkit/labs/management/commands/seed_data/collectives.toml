display_order = 10
volunteer_count = ""
about = "Art Club is a relaxed, once-a-week social gathering where people can take a break from their daily routines and connect with supportive, like-minded creatives. It's a safe, welcoming space to explore ideas, experiment with different mediums, and share your artistic journey with others."
