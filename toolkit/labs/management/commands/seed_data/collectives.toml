[[collectives]]
name = "The Canny Little Library Collective"
slug = "canny-little-library"
display_order = 120
volunteer_count = ""
about = "A small lending library of radical (left/anarchist/alternative) books and zines at the Star and Shadow Cinema, maintained by volunteers who want to keep a diverse collection that many people might struggle to find elsewhere."
roles = "Sorting and tidying books on the shelves; categorising books and zines; deciding on new acquisitions; cataloguing returned books; social media about books and library-related events; writing book reviews; cataloguing books online; choosing books to display or promote; making posters. New ideas for activities are welcome."
organising = "A WhatsApp chat for communication. Volunteers meet irregularly, whenever someone suggests it and others are free, usually on a Sunday."
proud_of = ""
get_involved = "Get in touch via the library contact email with a bit about why you'd like to get involved. If you'd like to donate books, please contact the library first — space is limited."
