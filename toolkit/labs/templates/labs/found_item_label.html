<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label {{ item.label_id }}</title>
  <style>
    @page { size: A6 landscape; margin: 1cm; }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    .label {
      width: 100%;
      border: 3px solid #000;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .label-id {
      font-size: 3.5rem;
      font-weight: 900;
      font-family: monospace;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .label-description {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }
    .label-meta {
      font-size: 0.85rem;
      color: #444;
    }
    .label-footer {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: #666;
      border-top: 1px solid #ccc;
      padding-top: 0.4rem;
    }
    @media screen {
      body { background: #f0f0f0; padding: 2rem; }
      .label { max-width: 480px; margin: 0 auto; }
      .no-print { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #555; }
      .no-print a { color: #0d6efd; }
    }
    @media print {
      .no-print { display: none; }
    }
  </style>
</head>
<body>
  <div class="label">
    <div class="label-id">{{ item.label_id }}</div>
    <div class="label-description">{{ item.description }}</div>
    <div class="label-meta">Found: {{ item.found_on|date:"d M Y" }} &middot; Location: {{ item.location_found }}</div>
    <div class="label-footer">Lost &amp; found &mdash; Star and Shadow Cinema</div>
  </div>
  <div class="no-print">
    <p>Use your browser's print function (Ctrl/Cmd + P) to print this label.</p>
    <p><a href="{% url "labs-found-item" item.pk %}">&larr; Back to {{ item.label_id }}</a></p>
  </div>
</body>
</html>
