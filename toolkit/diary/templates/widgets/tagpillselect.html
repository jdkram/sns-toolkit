<div class="tag-pill-select">{% for group, subgroup, index in widget.optgroups %}{% for option in subgroup %}<label class="tag-pill" for="{{ option.attrs.id }}"><input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value }}" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}><span>{{ option.label }}</span></label>{% endfor %}{% endfor %}</div>
