networks:
  toolkit_staging:
    driver: bridge
# Cap container log growth (9.158): Docker's json-file driver is unbounded
# by default.
x-logging: &defaultLogging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  toolkit:
    user: "1002:1002"
    networks:
      - toolkit_staging
    image: toolkit:staging
    build: .
    command: ["tk_run", "gunicorn"]
    restart: on-failure
    logging: *defaultLogging
    ports:
      - "127.0.0.1:7192:8000"
    environment:
      NO_REDIS: "true"
    volumes:
      - type: bind
        source: /home/staging/site/media/
        target: /site/media/
      - type: bind
        source: /var/run/mysqld/mysqld.sock
        target: /var/run/mysqld/mysqld.sock
      - type: bind
        source: /home/staging/settings_docker_staging.py
        target: /site/toolkit/settings.py
