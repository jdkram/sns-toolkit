{% extends "base_wagtail.html" %}
{% load wagtailcore_tags wagtailimages_tags %}

{% block body %}
{{ block.super }}
<article class="article-page">
    {% if page.image %}
    <figure class="article-page__figure article-page__figure--{{ page.image_alignment|lower }}">
        {% image page.image original %}
    </figure>
    {% endif %}
    <h3>{{ page.title }}</h3>
    <div class="copy">
        {{ page.body|richtext }}
    </div>
</article>
{% endblock %}
