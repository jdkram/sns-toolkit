# human-contributors: ["Jonny Kram"]; ai-contributors: ["Claude Opus 5"]; status: "#ai-input"
#
# Tool configuration for the Cube/S+S toolkit.
#
# Before this file existed, every tool setting lived in prose in
# docs/ONBOARDING.md. That meant `black` run without arguments used its
# default 88-column width and reformatted the entire repo, and `ruff` was
# never wired in at all -- which is how a June 2026 refactor shipped 500+
# unused imports that went unnoticed for two and a half months.
#
# Added during the September 2026 quality pass (docs/ARCHIVE/QUALITY_PASS_2026_09.md).

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "ARG", "C901"]

# E501 (line-too-long) is deliberately off: `black` owns line length, and
# it cannot split long string literals or comments. Even immediately after
# a clean `black --line-length 79` pass, 1,375 lines still exceed 79 --
# mostly `help_text`, log messages and seed data. Enabling it would mean a
# permanently red gate that everyone learns to ignore, which is worse than
# no gate. E203 is off for the same reason: it disagrees with black on
# slice whitespace.
ignore = ["E501", "E203"]

[tool.ruff.lint.mccabe]
# The honest target is 12; 18 functions still exceed it, the worst at 20
# (`edit_volunteer`). The gate sits at the current worst so it is green
# today and stops anything getting *more* tangled. Ratchet it down whenever
# one of those functions is split. `seed_dev_data.handle` (complexity 101)
# is excluded below rather than setting the bar for everything else.
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# The views packages are re-export shims: `urls.py` imports the package and
# reaches through to the symbols. `labs/views/` and `diary/edit_views/`
# declare `__all__` so ruff already spares them; `members/views/` does not,
# and without this its 34 re-exports would be auto-removed and the URLconf
# would break. Ignoring F401 package-wide covers all three regardless.
"__init__.py" = ["F401"]

# Test modules legitimately import fixtures and helpers for their side
# effects, and unused arguments are normal in mock signatures.
"*/tests/*" = ["ARG"]

# Django's settings layering (`from .settings_common import *`) is the
# idiomatic way to do per-venue overrides. Star imports are correct here.
"toolkit/*settings*.py" = ["F403", "F405"]

# Django's signal-receiver API dictates `sender` and `**kwargs`, whether or
# not the receiver body uses them.
"*/signals.py" = ["ARG001"]

# Three @receiver-decorated login/logout/login-failed handlers, same
# framework-mandated signature as */signals.py above -- this file just
# isn't named that.
"toolkit/toolkit_auth/decorators.py" = ["ARG001"]

# Django's BaseCommand.handle(self, *args, **options) API dictates that
# signature, whether or not a given command reads `args`/`options`.
"*/management/commands/*.py" = ["ARG002"]

# One long, linear seeding script (complexity 101). Splitting it is a
# separate job; until then it must not set the complexity bar for the
# rest of the codebase.
"*/management/commands/seed_dev_data.py" = ["C901"]
