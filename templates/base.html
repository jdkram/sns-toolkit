{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %}</title>
<link rel="shortcut icon" href="{{ VENUE.favicon }}">
{% block meta %}
<meta name="viewport" content="width=device-width,initial-scale=1">
{% endblock %}
{% block css %}{% endblock %}
{% block script %}{% endblock %}
<style>
.dev-watermark {
    position: fixed; top: 8px; right: 8px; z-index: 9999;
    background: rgba(220,0,0,0.82); color: #fff;
    font-family: monospace; font-size: 11px; font-weight: bold;
    padding: 3px 8px; border-radius: 3px; pointer-events: none;
    letter-spacing: 0.05em;
}
/* On narrow screens the badge overlaps the navbar toggler button.
   Centre it at the top so it clears both the logo (left) and burger (right). */
@media (max-width: 767px) {
    .dev-watermark {
        right: auto;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
    }
}
</style>
</head>
<body>
<div class="dev-watermark">DEV · {{ VERSION }}</div>
{% block header %}{% endblock %}
{% block body %}{% endblock %}
{% block footer %}{% endblock %}
</body>
</html>
