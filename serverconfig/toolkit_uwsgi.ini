# mysite_uwsgi.ini file
# http://uwsgi-docs.readthedocs.io/en/latest/tutorials/Django_and_nginx.html
[uwsgi]

# Django-related settings
# the base directory (full path)
chdir           = /home/toolkit/site

# Django's wsgi file
module          = wsgi
# the virtualenv (full path)
home            = /home/toolkit/site/venv

env             = DJANGO_SETTINGS_MODULE=toolkit.settings

# process-related settings
# master
master          = true
# maximum number of worker processes
processes       = 4
# the socket (use the full path to be safe)
socket          = /tmp/cube_django.sock
# TODO work out permission to run in /var/run
# Socket  permissions. Was 664, then 666. 660 works now
chmod-socket    = 660
# clear environment on exit
vacuum          = true

uid             = www-data
gid             = www-data

enable-threads  = true
# http://uwsgi-docs.readthedocs.io/en/latest/articles/SerializingAccept.html
thunder-lock    = true

# NOTE: this ini file is superseded by the Docker production setup, which uses
# gunicorn (see containerconfig/tk_run.sh). This file is retained as a
# reference for non-Docker deployments. If you use it, ensure harakiri is set:
harakiri = 30     # kill and respawn any worker stuck on a request for >30s
# limit the project to 128 MB
limit-as = 512

# Enable stats
stats = 127.0.0.1:9191

safe-pidfile    = /tmp/cube_django.pid
daemonize       = /var/log/cubetoolkit/cube_django.log
