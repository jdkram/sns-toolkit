<svg viewBox="0 0 860 1310" xmlns="http://www.w3.org/2000/svg"

  <title id="diag-title">How Bookings Work — S+S Toolkit</title>
  <desc id="diag-desc">
    Three examples, each showing the Event → Showing → Room Booking chain. Each example has a
    blueprint-style Template card to the left of its Event, connected by a dashed arrow. The
    templates (Live Music, Café, Film) pre-fill copy, pricing, tags, and rota roles on creation
    — not room bookings.
    Example 1: a live music gig with one Showing connected to two Room Bookings — Venue Space
    from 16:00 and Meeting Room from 18:00, before doors at 19:30. Example 2: Café Open Every
    Sunday — one Event fans out to three discrete Showing cards, each with its own Room Booking.
    Example 3: Late Summer Film Programme — same fan structure, three Showings with statuses
    confirmed, tentative, and cancelled, each handled differently at the Room Booking level.
  </desc>

    </style>

  </text>

    Event → Showings → Room Bookings
  </text>

       Range: 16:00 to 23:00 = 420 min
       x: 55 to 805 = 750 px → scale = 750/420 = 1.786 px/min

  <text x="269" y="453" text-anchor="middle" font-size="9" fill="#d97706">18:00</text>
  <text x="430" y="453" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">19:30</text>
  <text x="698" y="453" text-anchor="middle" font-size="9" fill="#d97706">22:00</text>
  <text x="805" y="453" text-anchor="middle" font-size="9" fill="#d97706">23:00</text>

  <!-- Note -->
  <text x="430" y="489" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">
    Both rooms are booked before the showing starts. Venue Space needed from 16:00 for band

  </text>
  <text x="430" y="504" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">
