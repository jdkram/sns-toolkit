<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Bookings Work — S+S Toolkit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e8e4de;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 36px 16px 52px;
  }
  svg { max-width: 900px; width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 860 1050" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="diag-title diag-desc">
  <title id="diag-title">How Bookings Work — S+S Toolkit</title>
  <desc id="diag-desc">
    Two examples. Example 1: a live music gig booking Venue Space from 16:00 for load-in
    and Meeting Room as artists' green room from 18:00, with doors at 19:30 — showing how
    room bookings can start before the showing. Example 2: Café Open Every Sunday — one
    event with many weekly showings, each booking only the Café from 12:00 to 16:00.
  </desc>

  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    </style>
    <filter id="sh" x="-8%" y="-8%" width="124%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00000016"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0.5 L 8 3.5 L 0 6.5 Z" fill="#b0bec5"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="860" height="1050" fill="#e8e4de"/>

  <!-- ════════════════════ PAGE TITLE ════════════════════ -->
  <text x="430" y="33" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">
    How Bookings Work
  </text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#64748b">
    Event → Showings → Room Bookings
  </text>

  <!-- ════════════════════════════════════════════════════════
       EXAMPLE 1 — Live music gig
       ════════════════════════════════════════════════════════ -->

  <line x1="30" y1="64" x2="830" y2="64" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="30" y="76" font-size="10" font-weight="700" letter-spacing="1.5" fill="#94a3b8">
    EXAMPLE 1 — LIVE MUSIC GIG: MULTIPLE ROOMS, EARLY SETUP
  </text>

  <!-- EVENT card: x=222 y=84 w=416 h=78 -->
  <rect x="222" y="84" width="416" height="78" rx="11" fill="#eff6ff" filter="url(#sh)"/>
  <text x="243" y="103" font-size="9" font-weight="700" letter-spacing="2" fill="#93c5fd">EVENT</text>
  <text x="430" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a5f">
    Liquid Architecture #14
  </text>
  <text x="430" y="147" text-anchor="middle" font-size="12" fill="#3b82f6">
    Experimental electronic music · live · public
  </text>

  <!-- Arrow Event → Showing -->
  <line x1="430" y1="162" x2="430" y2="190" stroke="#b0bec5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SHOWING card: x=148 y=193 w=564 h=78 -->
  <rect x="148" y="193" width="564" height="78" rx="11" fill="#f0fdf4" filter="url(#sh)"/>
  <text x="169" y="212" font-size="9" font-weight="700" letter-spacing="2" fill="#6ee7b7">SHOWING</text>
  <text x="430" y="234" text-anchor="middle" font-size="17" font-weight="700" fill="#064e3b">
    Sat 14 Jun 2026 · 19:30
  </text>
  <rect x="372" y="241" width="116" height="18" rx="9" fill="#10b981"/>
  <text x="430" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="white">● confirmed</text>
  <text x="430" y="265" text-anchor="middle" font-size="11" fill="#065f46">
    Running time: 3 hrs · public event
  </text>

  <!-- Arrow Showing → Room Bookings -->
  <line x1="340" y1="271" x2="215" y2="318" stroke="#b0bec5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ROOM BOOKINGS card: x=20 y=322 w=820 h=196 -->
  <rect x="20" y="322" width="820" height="196" rx="11" fill="#fffbeb" filter="url(#sh)"/>
  <text x="40" y="341" font-size="9" font-weight="700" letter-spacing="2" fill="#fcd34d">
    ROOM BOOKINGS
  </text>

  <!-- Venue Space row -->
  <circle cx="42" cy="356" r="5.5" fill="#0057B8"/>
  <text x="57" y="361" font-size="13" font-weight="600" fill="#1e293b">Venue Space</text>
  <text x="163" y="361" font-size="13" fill="#475569">16:00 – 23:00</text>
  <rect x="300" y="350" width="62" height="16" rx="8" fill="#bfdbfe"/>
  <text x="331" y="362" text-anchor="middle" font-size="10" fill="#1d4ed8">load-in</text>

  <!-- Meeting Room row -->
  <circle cx="42" cy="377" r="5.5" fill="#A78BFA"/>
  <text x="57" y="382" font-size="13" font-weight="600" fill="#1e293b">Meeting Room</text>
  <text x="163" y="382" font-size="13" fill="#475569">18:00 – 22:00</text>
  <rect x="300" y="371" width="74" height="16" rx="8" fill="#ede9fe"/>
  <text x="337" y="383" text-anchor="middle" font-size="10" fill="#6d28d9">green room</text>

  <!-- Separator -->
  <line x1="40" y1="393" x2="820" y2="393" stroke="#fde68a" stroke-width="1"/>

  <!-- Timeline
       Range: 16:00 to 23:00 = 420 min
       x: 55 to 805 = 750 px  →  scale = 750/420 = 1.786 px/min
       16:00 →  0 min → x=55
       18:00 → 120 min → x=55+214 = 269
       19:30 → 210 min → x=55+375 = 430
       22:00 → 360 min → x=55+643 = 698
       23:00 → 420 min → x=805
  -->

  <!-- Showing-start dashed line -->
  <line x1="430" y1="393" x2="430" y2="456" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2.5"/>

  <!-- Venue Space bar: 16:00–23:00, x=55 width=750 -->
  <rect x="55" y="402" width="750" height="14" rx="4" fill="#0057B8" opacity="0.8"/>
  <text x="63" y="413" font-size="9" fill="white">Venue Space</text>

  <!-- Meeting Room bar: 18:00–22:00, x=269 width=429 -->
  <rect x="269" y="420" width="429" height="14" rx="4" fill="#A78BFA" opacity="0.9"/>
  <text x="277" y="431" font-size="9" fill="white">Meeting Room</text>

  <!-- Time axis -->
  <line x1="55" y1="440" x2="805" y2="440" stroke="#fde68a" stroke-width="1"/>

  <!-- Tick marks -->
  <line x1="55"  y1="437" x2="55"  y2="442" stroke="#d97706" stroke-width="1"/>
  <line x1="269" y1="437" x2="269" y2="442" stroke="#d97706" stroke-width="1"/>
  <line x1="430" y1="437" x2="430" y2="442" stroke="#059669" stroke-width="1.5"/>
  <line x1="698" y1="437" x2="698" y2="442" stroke="#d97706" stroke-width="1"/>
  <line x1="805" y1="437" x2="805" y2="442" stroke="#d97706" stroke-width="1"/>

  <!-- Time labels -->
  <text x="55"  y="453" text-anchor="middle" font-size="9" fill="#d97706">16:00</text>
  <text x="269" y="453" text-anchor="middle" font-size="9" fill="#d97706">18:00</text>
  <text x="430" y="453" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">19:30</text>
  <text x="698" y="453" text-anchor="middle" font-size="9" fill="#d97706">22:00</text>
  <text x="805" y="453" text-anchor="middle" font-size="9" fill="#d97706">23:00</text>
  <text x="430" y="465" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">doors open</text>

  <!-- Note -->
  <text x="430" y="489" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">
    Both rooms are booked before the showing starts. Venue Space needed from 16:00 for band
    load-in; Meeting Room serves as the artists' green room
  </text>
  <text x="430" y="504" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">
    (the actual Green Room is usually full of clutter).
  </text>

  <!-- ════════════════════════════════════════════════════════
       EXAMPLE 2 — Café Open Every Sunday
       ════════════════════════════════════════════════════════ -->

  <line x1="30" y1="538" x2="830" y2="538" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="30" y="550" font-size="10" font-weight="700" letter-spacing="1.5" fill="#94a3b8">
    EXAMPLE 2 — RECURRING WEEKLY SHOWING: ONE ROOM, SIMPLE TIMING
  </text>

  <!-- EVENT card: x=222 y=558 w=416 h=78 -->
  <rect x="222" y="558" width="416" height="78" rx="11" fill="#eff6ff" filter="url(#sh)"/>
  <text x="243" y="577" font-size="9" font-weight="700" letter-spacing="2" fill="#93c5fd">EVENT</text>
  <text x="430" y="600" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a5f">
    Café Open Every Sunday
  </text>
  <text x="430" y="621" text-anchor="middle" font-size="12" fill="#3b82f6">
    12 noon – 4pm · weekly recurring · public
  </text>

  <!-- Arrow Event → Showings -->
  <line x1="430" y1="636" x2="430" y2="660" stroke="#b0bec5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="441" y="651" font-size="10" fill="#94a3b8">one showing per week</text>

  <!-- SHOWINGS + ROOM BOOKINGS card: x=20 y=664 w=820 h=300 -->
  <rect x="20" y="664" width="820" height="300" rx="11" fill="#fffbeb" filter="url(#sh)"/>
  <text x="40" y="683" font-size="9" font-weight="700" letter-spacing="2" fill="#fcd34d">
    SHOWINGS + ROOM BOOKINGS
  </text>

  <!-- Column divider and labels -->
  <line x1="40" y1="688" x2="820" y2="688" stroke="#fde68a" stroke-width="1"/>
  <line x1="318" y1="688" x2="318" y2="954" stroke="#fde68a" stroke-width="0.75" stroke-dasharray="3,3"/>

  <!-- Timeline header (right column): 11:30–16:30 → x=325 to 800 -->
  <text x="338" y="700" font-size="9" fill="#d97706">12:00</text>
  <text x="795" y="700" text-anchor="end" font-size="9" fill="#d97706">16:00</text>
  <line x1="325" y1="702" x2="800" y2="702" stroke="#fde68a" stroke-width="0.5"/>

  <!-- Rows — each 36px apart; Café bar always x=325 width=475 -->

  <!-- Row 1: Sun 18 May 2025 -->
  <circle cx="42" cy="720" r="5" fill="#FFD700" stroke="#d97706" stroke-width="0.5"/>
  <text x="56" y="724" font-size="12" font-weight="600" fill="#064e3b">Sun 18 May 2025 · 12:00</text>
  <rect x="325" y="712" width="475" height="14" rx="4" fill="#FFD700" opacity="0.85"/>
  <text x="333" y="723" font-size="9" fill="#78350f">Café  12:00 – 16:00</text>

  <!-- Row 2: Sun 25 May 2025 -->
  <circle cx="42" cy="756" r="5" fill="#FFD700" stroke="#d97706" stroke-width="0.5"/>
  <text x="56" y="760" font-size="12" font-weight="600" fill="#064e3b">Sun 25 May 2025 · 12:00</text>
  <rect x="325" y="748" width="475" height="14" rx="4" fill="#FFD700" opacity="0.85"/>
  <text x="333" y="759" font-size="9" fill="#78350f">Café  12:00 – 16:00</text>

  <!-- Row 3: Sun 1 Jun 2025 -->
  <circle cx="42" cy="792" r="5" fill="#FFD700" stroke="#d97706" stroke-width="0.5"/>
  <text x="56" y="796" font-size="12" font-weight="600" fill="#064e3b">Sun 1 Jun 2025 · 12:00</text>
  <rect x="325" y="784" width="475" height="14" rx="4" fill="#FFD700" opacity="0.85"/>
  <text x="333" y="795" font-size="9" fill="#78350f">Café  12:00 – 16:00</text>

  <!-- Row 4: Sun 8 Jun 2025 -->
  <circle cx="42" cy="828" r="5" fill="#FFD700" stroke="#d97706" stroke-width="0.5"/>
  <text x="56" y="832" font-size="12" font-weight="600" fill="#064e3b">Sun 8 Jun 2025 · 12:00</text>
  <rect x="325" y="820" width="475" height="14" rx="4" fill="#FFD700" opacity="0.85"/>
  <text x="333" y="831" font-size="9" fill="#78350f">Café  12:00 – 16:00</text>

  <!-- Ellipsis -->
  <text x="160" y="862" text-anchor="middle" font-size="20" fill="#94a3b8">···</text>
  <text x="562" y="862" text-anchor="middle" font-size="20" fill="#94a3b8">···</text>

  <!-- Note -->
  <text x="430" y="895" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">
    Each showing has exactly one room booking, starting at the same time as the showing.
  </text>
  <text x="430" y="911" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">
    A new showing (and its Café booking) is created for each occurrence. No setup window needed.
  </text>
  <text x="430" y="930" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">
    Contrast with Example 1: here room booking start = showing start, every time.
  </text>

  <!-- ════════════════════ FOOTER ════════════════════ -->
  <text x="430" y="1032" text-anchor="middle" font-size="10" fill="#a39d95">
    Star &amp; Shadow · Cube Toolkit · docs/how_bookings_work.html
  </text>

</svg>
</body>
</html>
