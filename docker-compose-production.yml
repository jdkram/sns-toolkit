networks:
  toolkit_production:
    driver: bridge
# Cap container log growth (9.158): Docker's json-file driver is unbounded
# by default.
x-logging: &defaultLogging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  toolkit:
    user: "1001:1001"
    networks:
      - toolkit_production
    image: toolkit:production
    build: .
    command: ["tk_run", "gunicorn"]
    restart: on-failure
    logging: *defaultLogging
    ports:
      - "127.0.0.1:7191:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    volumes:
      - type: bind
        source: /home/toolkit/site/media/
        target: /site/media/
      - type: bind
        source: /var/run/mysqld/mysqld.sock
        target: /var/run/mysqld/mysqld.sock
      - type: bind
        source: /home/toolkit/settings_docker_production.py
        target: /site/toolkit/settings.py
  mailer:
    user: "1001:1001"
    networks:
      - toolkit_production
    image: toolkit:production
    command: ["tk_run", "mailerd"]
    restart: on-failure
    logging: *defaultLogging
    # Give mailerd time to finish sending in-progress emails before Docker
    # kills it. Default is 10s, which is too short for a large mailout.
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f mailerd || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "0.5"
    volumes:
      - type: bind
        source: /var/run/mysqld/mysqld.sock
        target: /var/run/mysqld/mysqld.sock
      - type: bind
        source: /home/toolkit/settings_docker_production.py
        target: /site/toolkit/settings.py
