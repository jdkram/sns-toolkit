# This compose file is for development and test, not for production deployment!
#
# Dev workflow:
#   - Source is bind-mounted from the host — no rebuild needed for code changes
#   - Django's runserver serves static files directly from source (DEBUG=True)
#   - Python changes auto-reload; template changes are instant (no caching)
#   - Only rebuild the image when dependencies change (requirements/*.txt, Dockerfile)
networks:
  toolkit_dev:
    driver: bridge
volumes:
  media_data:
  seed_image_cache:
  mariadb_data:
services:
  toolkit:
    networks:
      - toolkit_dev
    image: toolkit:latest
    build: .
    command: ["tk_run", "runserver"]
    restart: on-failure
    environment: &commonEnv
      DB_NAME: "${DB_NAME:-toolkit}"
      DB_USER: "${DB_USER:-toolkit}"
      DB_PASSWORD: "${DB_PASSWORD:-devserver_db_password}"
      DB_HOST: "mariadb"
      DB_PORT: "3306"
      SECRET_KEY: "${DJANGO_SECRET_KEY:-really_bad_django_secret_key}"
      DJANGO_SETTINGS_MODULE: "toolkit.docker_settings_ss"
    ports:
      - target: "8000"
        published: "8000"
        protocol: tcp
    volumes:
      # Bind-mount source so all code/template/static changes are live immediately.
      - type: bind
        source: .
        target: /site/
      - type: volume
        source: media_data
        target: /site/media/
      - type: volume
        source: seed_image_cache
        target: /site/.seed_cache/
  scheduler:
    networks:
      - toolkit_dev
    image: toolkit:latest
    command: ["tk_run", "scheduler"]
    restart: unless-stopped
    environment: *commonEnv
    volumes:
      - type: bind
        source: .
        target: /site/
      - type: volume
        source: media_data
        target: /site/media/
  mariadb:
    networks:
      - toolkit_dev
    image: mariadb:10
    environment:
      MARIADB_USER: "${DB_USER:-toolkit}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-devserver_db_password}"
      MARIADB_ROOT_PASSWORD: rubbishpassword
      MARIADB_DATABASE: toolkit
    volumes:
      - type: volume
        source: mariadb_data
        target: /var/lib/mysql
