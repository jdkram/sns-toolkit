# human-contributors: ["Jonny Kram"]; ai-contributors: ["Claude Opus 5"]; status: "#ai-input"
#
# Runs ruff and black on staged files before each commit. Config for both
# lives in pyproject.toml.
#
# Install once per checkout: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--exit-non-zero-on-fix]

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
