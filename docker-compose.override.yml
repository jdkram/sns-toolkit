# Development overrides — applied automatically by docker compose.
# Bind-mounts source directories so Python and template changes take effect
# without a full image rebuild. Gunicorn --reload watches for Python changes.
# Templates reload per-request already (TEMPLATES debug=True in docker_settings_starandshadow.py).
#
# WARNING: DO NOT USE IN PRODUCTION. GUNICORN_RELOAD=1 will cause workers to
# restart on any filesystem change, dropping in-flight requests. Deploy with
# docker-compose-production.yml explicitly: docker compose -f docker-compose-production.yml up
#
# Usage: docker compose up  (override is applied automatically in dev)
# To rebuild from scratch: docker compose up --build
services:
  toolkit:
    environment:
      GUNICORN_RELOAD: "1"
    volumes:
      - type: bind
        source: ./toolkit
        target: /site/toolkit
      - type: bind
        source: ./star_and_shadow_templates
        target: /site/star_and_shadow_templates
